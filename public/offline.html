<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08786f" />
    <title>You're offline — Boardmark</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 32px; background: #f7f9f8; color: #233342; font: 16px/1.55 system-ui, sans-serif; text-align: center; }
      main { max-width: 340px; }
      .mark { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 24px; border-radius: 14px; background: #08786f; color: white; font-size: 32px; }
      h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.2; }
      p { margin: 0; color: #71848b; }
      button { min-height: 44px; margin-top: 26px; padding: 0 20px; border: 0; border-radius: 9px; background: #08786f; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">☾</div>
      <h1>You're offline</h1>
      <p>Open Boardmark once while connected to save it for offline use. Then your stays on this device will be available here.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
